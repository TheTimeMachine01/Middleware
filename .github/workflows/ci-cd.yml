name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test-and-push-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build local image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Load image into local Docker daemon
          tags: middleware-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run testing container (with dependencies)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-key-at-least-256-bits-long' }}
          JWT_EXPIRATION_TIME: ${{ secrets.JWT_EXPIRATION_TIME || '3600000' }}
          REFRESH_EXPIRATION_TIME: ${{ secrets.REFRESH_EXPIRATION_TIME || '86400000' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || 'test-key' }}
        run: |
          # Use our CI-specific docker-compose file to start everything
          export JWT_SECRET=$JWT_SECRET
          export JWT_EXPIRATION_TIME=$JWT_EXPIRATION_TIME
          export REFRESH_EXPIRATION_TIME=$REFRESH_EXPIRATION_TIME
          export NVIDIA_API_KEY=$NVIDIA_API_KEY
          docker compose -f docker-compose.ci.yml up -d

      - name: Wait for application to be healthy
        run: |
          echo "Waiting up to 120s for app to respond on http://localhost:8080/api/healthz"
          for i in $(seq 1 60); do
            # We check the health endpoint. It should return 'ok' for app, db, and valkey.
            HEALTH_RESP=$(curl -s http://localhost:8080/api/healthz || echo "{}")
            echo "Health response: $HEALTH_RESP"
            
            APP_STATUS=$(echo $HEALTH_RESP | jq -r '.app // "error"')
            DB_STATUS=$(echo $HEALTH_RESP | jq -r '.db // "error"')
            REDIS_STATUS=$(echo $HEALTH_RESP | jq -r '.valkey // "error"')
            
            if [ "$APP_STATUS" == "ok" ] && [ "$DB_STATUS" == "ok" ] && [ "$REDIS_STATUS" == "ok" ]; then
              echo "Application is fully healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed health check - dumping container logs"
          docker compose -f docker-compose.ci.yml logs middleware
          exit 1

      - name: Run basic smoke test (authenticated login)
        env:
          TEST_USER_EMAIL: ci-test@example.com
          TEST_USER_PASS: ci-password
        run: |
          echo "Registering test user"
          curl -s -X POST "http://localhost:8080/api/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"CI Test\",\"email\":\"$TEST_USER_EMAIL\",\"password\":\"$TEST_USER_PASS\"}" || true

          echo "Logging in"
          LOGIN_RESP=$(curl -s -X POST "http://localhost:8080/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_USER_EMAIL\",\"password\":\"$TEST_USER_PASS\"}")
          
          ACCESS_TOKEN=$(echo $LOGIN_RESP | jq -r '.accessToken // empty')
          
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Login failed - response: $LOGIN_RESP"
            exit 1
          fi
          
          echo "Login successful! Token obtained."

      - name: Push final image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/middleware:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/middleware:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v || true

  deploy:
    needs: test-and-push-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render.com Deploy Hook
        run: |
          echo "Triggering Render.com deploy hook..."
          curl -s -X POST "${{ secrets.RENDER_HOOK }}"
