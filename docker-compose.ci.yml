version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-test
    environment:
      POSTGRES_DB: middleware_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d middleware_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: redis-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  middleware:
    image: middleware-test:latest
    container_name: middleware-test-container
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/middleware_db
      DB_USER: user
      DB_PASS: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
      REFRESH_EXPIRATION_TIME: ${REFRESH_EXPIRATION_TIME}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
