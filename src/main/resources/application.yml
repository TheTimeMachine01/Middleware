
server:
  address: 0.0.0.0

spring:
  application:
    name: Middleware

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:file:.env

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}

  graphql:
    graphiql:
      enabled: true

app:
  channels:
    ml-logs: "ml:predictions" # The channel used by BEAST MODE for live logs

jwt:
  secret: ${JWT_SECRET}
  expiration-time: ${JWT_EXPIRATION_TIME}
  refresh-expiration-time: ${REFRESH_EXPIRATION_TIME}

nvidia:
  api:
    key: ${NVIDIA_API_KEY}
    base-url: https://integrate.api.nvidia.com/v1
    model: ${NVIDIA_MODEL_NAME:meta/llama-3.1-70b-instruct}
