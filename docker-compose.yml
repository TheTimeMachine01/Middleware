version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: middleware_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d middleware_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  middleware:
    build: .
    container_name: middleware_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/middleware_db
      DB_USER: user
      DB_PASS: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-your-default-secret-key-at-least-256-bits-long-change-this}
      JWT_EXPIRATION_TIME: 3600000
      REFRESH_EXPIRATION_TIME: 86400000
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-your-default-key}
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
